<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlTag">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ORVEX - Control Panel</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --primary-color: #6366f1;
            --primary-hover: #4f46e5;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            transition: background-color 0.3s, color 0.3s;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Navbar */
        header {
            background-color: var(--card-bg);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
        }

        .nav-links {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .nav-item {
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 600;
            cursor: pointer;
            padding: 8px 12px;
            border-radius: 6px;
        }

        .nav-item:hover, .nav-item.active {
            color: var(--text-color);
            background-color: rgba(255, 255, 255, 0.05);
        }

        .lang-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 6px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
        }

        .lang-btn:hover {
            border-color: var(--primary-color);
        }

        /* Container & Sections */
        .container {
            max-width: 1000px;
            margin: 30px auto;
            padding: 0 20px;
            width: 100%;
            flex: 1;
        }

        .section {
            display: none;
        }

        .section.active {
            display: block;
        }

        /* Cards & Grid */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .status-badge {
            background-color: rgba(34, 197, 94, 0.15);
            color: #4ade80;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
        }

        .btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            margin-top: 10px;
        }

        .btn:hover {
            background-color: var(--primary-hover);
        }

        /* Color Picker Buttons */
        .theme-options {
            display: flex;
            gap: 12px;
            margin-top: 15px;
        }

        .color-dot {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid transparent;
        }

        .color-dot:hover {
            transform: scale(1.1);
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 20px;
            border-top: 1px solid var(--border-color);
            color: var(--text-muted);
            font-size: 14px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .badge-tfs {
            background-color: var(--primary-color);
            color: white;
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 12px;
        }
    </style>
</head>
<body>

    <!-- Header Navbar -->
    <header>
        <div class="nav-links">
            <span class="nav-item active" onclick="showSection('bots')" id="nav-bots">البوتات</span>
            <span class="nav-item" onclick="showSection('settings')" id="nav-settings">الإعدادات</span>
            <span class="nav-item" onclick="showSection('profile')" id="nav-profile">البروفايل</span>
        </div>
        <button class="lang-btn" onclick="toggleLanguage()" id="langBtn">English</button>
    </header>

    <!-- Main Content Container -->
    <div class="container">

        <!-- Bots Section -->
        <div id="bots" class="section active">
            <h2 id="title-bots">قائمة البوتات</h2>
            <div class="grid">
                <div class="card">
                    <div class="card-header">
                        <h3>Main Bot</h3>
                        <span class="status-badge" id="status-online">متصل</span>
                    </div>
                    <p style="color: var(--text-muted); font-size: 14px;">بوت الإدارة الأساسي</p>
                    <button class="btn" id="btn-manage">إدارة</button>
                </div>
            </div>
        </div>

        <!-- Settings Section -->
        <div id="settings" class="section">
            <h2 id="title-settings">إعدادات النظام</h2>
            <div class="card" style="margin-top: 20px;">
                <p id="txt-settings">خيارات إعدادات الحساب والسيرفرات الخاصة بك.</p>
            </div>
        </div>

        <!-- Profile Section -->
        <div id="profile" class="section">
            <h2 id="title-profile">الملف الشخصي</h2>
            <div class="card" style="margin-top: 20px;">
                <h4 id="txt-theme-title">تغيير لون الواجهة:</h4>
                <div class="theme-options">
                    <div class="color-dot" style="background-color: #6366f1;" onclick="setTheme('#6366f1', '#4f46e5')"></div>
                    <div class="color-dot" style="background-color: #10b981;" onclick="setTheme('#10b981', '#059669')"></div>
                    <div class="color-dot" style="background-color: #ec4899;" onclick="setTheme('#ec4899', '#db2777')"></div>
                    <div class="color-dot" style="background-color: #f59e0b;" onclick="setTheme('#f59e0b', '#d97706')"></div>
                </div>
            </div>
        </div>

    </div>

    <!-- Footer -->
    <footer>
        <span id="footer-text">مطور المشروع ومؤسس الموقع ORVEX</span>
        <span class="badge-tfs">TFS</span>
    </footer>

    <!-- JavaScript Logic -->
    <script>
        let currentLang = 'ar';

        function showSection(sectionId) {
            document.querySelectorAll('.section').forEach(sec => sec.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
            
            document.getElementById(sectionId).classList.add('active');
            document.getElementById('nav-' + sectionId).classList.add('active');
        }

        function setTheme(primary, hover) {
            document.documentElement.style.setProperty('--primary-color', primary);
            document.documentElement.style.setProperty('--primary-hover', hover);
        }

        function toggleLanguage() {
            const html = document.getElementById('htmlTag');
            const langBtn = document.getElementById('langBtn');

            if (currentLang === 'ar') {
                currentLang = 'en';
                html.dir = 'ltr';
                html.lang = 'en';
                langBtn.innerText = 'عربي';

                // Navigation
                document.getElementById('nav-bots').innerText = 'Bots';
                document.getElementById('nav-settings').innerText = 'Settings';
                document.getElementById('nav-profile').innerText = 'Profile';

                // Titles
                document.getElementById('title-bots').innerText = 'Bot List';
                document.getElementById('title-settings').innerText = 'System Settings';
                document.getElementById('title-profile').innerText = 'User Profile';

                // Content
                document.getElementById('status-online').innerText = 'Online';
                document.getElementById('btn-manage').innerText = 'Manage';
                document.getElementById('txt-settings').innerText = 'Your account and server setup options.';
                document.getElementById('txt-theme-title').innerText = 'Change Theme Color:';
                document.getElementById('footer-text').innerText = 'Project Developer & Site Founder ORVEX';
            } else {
                currentLang = 'ar';
                html.dir = 'rtl';
                html.lang = 'ar';
                langBtn.innerText = 'English';

                // Navigation
                document.getElementById('nav-bots').innerText = 'البوتات';
                document.getElementById('nav-settings').innerText = 'الإعدادات';
                document.getElementById('nav-profile').innerText = 'البروفايل';

                // Titles
                document.getElementById('title-bots').innerText = 'قائمة البوتات';
                document.getElementById('title-settings').innerText = 'إعدادات النظام';
                document.getElementById('title-profile').innerText = 'الملف الشخصي';

                // Content
                document.getElementById('status-online').innerText = 'متصل';
                document.getElementById('btn-manage').innerText = 'إدارة';
                document.getElementById('txt-settings').innerText = 'خيارات إعدادات الحساب والسيرفرات الخاصة بك.';
                document.getElementById('txt-theme-title').innerText = 'تغيير لون الواجهة:';
                document.getElementById('footer-text').innerText = 'مطور المشروع ومؤسس الموقع ORVEX';
            }
        }
    </script>
</body>
</html>
